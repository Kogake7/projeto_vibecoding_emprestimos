name: Qualidade
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar isolamento e decisão do executor
        shell: pwsh
        run: ./scripts/tests/verificador-runtime.test.ps1
      - run: pnpm db:generate
      - name: Preparar PostgreSQL local para os testes de integração
        run: docker --host unix:///var/run/docker.sock pull postgres:17-alpine
      - run: pnpm test --maxWorkers=1 --no-file-parallelism
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
